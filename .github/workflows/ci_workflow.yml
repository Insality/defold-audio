name: Run tests

on: [push]

jobs:
    build_and_run:
        name: Build and run tests
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v5
            with:
                lfs: true

          - uses: actions/setup-java@v5
            with:
                distribution: 'zulu'
                java-version: '25'

          # Headless Linux engine still dynamically links OpenAL/X11/GL at startup
          - name: Install Defold runtime deps
            run: |
              sudo apt-get update
              sudo apt-get install -y libopenal1 libxext6 libx11-6 libxi6 libgl1 libglu1-mesa

          - name: Build && Run
            run: |
              deployer_url="https://raw.githubusercontent.com/Insality/defold-deployer/6/deployer.sh"
              curl -s ${deployer_url} | bash -s lbd --headless --settings ./test/test.ini

          - name: Upload coverage reports to Codecov
            uses: codecov/codecov-action@v5
            with:
              token: ${{ secrets.CODECOV_TOKEN }}
              slug: Insality/defold-audio
